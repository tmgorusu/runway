[project]
name = "runway"
version = "0.1.0"
description = "Wear leveling for utility-dispatched home batteries (synthetic fleet)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Only needed to refresh the cache from the network. The demo never imports these.
ingest = ["gridstatus>=0.29", "pytz", "requests>=2.31", "openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
